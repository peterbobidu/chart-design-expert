name: Validate skill

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python3 scripts/check_package.py
      - run: python3 -m unittest discover -s 05-tests -p 'test_release.py'
      - run: python3 scripts/release.py build --out "$RUNNER_TEMP/skill-release"
      - run: python3 scripts/release.py verify --bundle "$RUNNER_TEMP/skill-release"
      - uses: actions/upload-artifact@v4
        with:
          name: chart-design-advisor-candidate-bundle
          path: ${{ runner.temp }}/skill-release

  prototype:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 06-assets/semiconductor-four-box-vue
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 06-assets/semiconductor-four-box-vue/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
